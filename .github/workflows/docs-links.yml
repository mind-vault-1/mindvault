name: Docs links

on:
  pull_request:
    paths:
      - "contract/contracts/vault-registry/src/test.rs"
      - "contract/contracts/vault-registry/src/test/**"
      - "scripts/check-contract-test-map.mjs"
      - "**/*.md"
      - ".markdown-link-check.json"
      - "scripts/check-doc-links.mjs"
      - ".github/workflows/docs-links.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "contract/contracts/vault-registry/src/test.rs"
      - "contract/contracts/vault-registry/src/test/**"
      - "scripts/check-contract-test-map.mjs"
      - "**/*.md"
      - ".markdown-link-check.json"
      - "scripts/check-doc-links.mjs"
      - ".github/workflows/docs-links.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check doc links
        run: pnpm docs:links

      - name: Check contract test map
        run: pnpm docs:contract-tests
