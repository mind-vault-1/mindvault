name: "Lint PR Title"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Accept issue-number PR titles
        if: ${{ startsWith(github.event.pull_request.title, '[') }}
        run: echo "Accepting issue-number title format for Wave/issue PRs."
      - name: Lint PR Title
        if: ${{ !startsWith(github.event.pull_request.title, '[') }}
        uses: amannn/action-semantic-pull-request@v6.1.2
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
